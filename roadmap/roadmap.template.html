<title>Roadmap Projet IUT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: band d'en-tête + onglets, Gantt pleine largeur avec colonne de libellés collante, fiche de détail en panneau latéral */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunken:#e9edf2; --ink:#14202b; --ink2:#465462; --muted:#76838f; --line:#d9e0e7;
  --accent:#0a6aa1; --accent-soft:#e1eef7;
  --todo:#8d99a6; --doing:#0a6aa1; --review:#a86a12; --done:#2c7a51; --late:#c0392b;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --sunken:#1c2733; --ink:#e5ecf2; --ink2:#a7b4c1; --muted:#7c8996; --line:#293541;
  --accent:#4cb0e6; --accent-soft:#15324a; --todo:#66727e; --doing:#4cb0e6; --review:#e0a64a; --done:#55b98a; --late:#f07b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunken:#1c2733; --ink:#e5ecf2; --ink2:#a7b4c1; --muted:#7c8996; --line:#293541;
  --accent:#4cb0e6; --accent-soft:#15324a; --todo:#66727e; --doing:#4cb0e6; --review:#e0a64a; --done:#55b98a; --late:#f07b6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 0;display:grid;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--sunken);border-radius:8px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--ink2)}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .s{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dates{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
.dates input{font:inherit;font-family:var(--f-mono);font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs a{padding:10px 14px;color:var(--ink2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:22px 60px;display:grid;gap:18px}
.banner{padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.chip{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* Gantt */
.gantt-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.gantt{min-width:900px;position:relative}
.g-row{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--line);min-height:44px}
.g-row:last-child{border-bottom:0}
.g-head{position:sticky;top:0;background:var(--surface);z-index:2}
.g-label{position:sticky;left:0;background:var(--surface);z-index:1;padding:8px 12px;display:flex;gap:10px;align-items:center;border-right:1px solid var(--line);min-width:0;cursor:pointer;text-align:left;border-top:0;border-bottom:0;border-left:0;font:inherit;color:inherit}
.g-row:hover .g-label,.g-row.sel .g-label{background:var(--sunken)}
.g-num{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:20px;flex:none}
.g-title{font-size:14px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.axis{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:4px;background:var(--sunken);color:var(--ink2);flex:none;margin-left:auto}
.g-track{position:relative;cursor:pointer}
.g-months{position:relative;height:34px}
.g-months span{position:absolute;top:9px;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateX(6px);white-space:nowrap}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.g-mark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--late);pointer-events:none;z-index:1}
.g-mark.today{border-left:2px solid var(--accent)}
.g-mark b{position:absolute;top:2px;left:4px;font:500 11px var(--f-mono);color:var(--ink2);background:var(--surface);padding:0 3px;white-space:nowrap}
.bar{position:absolute;top:13px;height:18px;border-radius:4px;background:color-mix(in srgb,var(--c) 22%,transparent);overflow:hidden;min-width:6px}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.bar-lbl{position:absolute;top:13px;height:18px;display:flex;align-items:center;font:500 11px var(--f-mono);color:var(--ink2);white-space:nowrap;padding-left:6px;pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.4}
/* Fiche */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgb(0 0 0 / .12);z-index:20;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:16px;align-content:start}
.drawer header{display:grid;gap:6px}
.close{justify-self:end;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:6px;padding:4px 10px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:12px;color:var(--ink2);font-weight:500}
.field input,.field textarea,.field select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:6px}
.tasks li:hover{background:var(--sunken)}
.tasks input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--done);flex:none}
.tasks label{flex:1;min-width:0;font-size:14px}
.tasks li.ok label{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--late)}
.addtask{display:flex;gap:6px}
.addtask input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink)}
.late{--c:var(--late)}
.muted{color:var(--muted)}
.small{font-size:13px}
/* Journal */
.j-form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.j-form .row3{display:grid;grid-template-columns:160px 200px 1fr;gap:10px}
.j-list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.j-item{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.j-item:last-child{border-bottom:0}
.j-date{font-family:var(--f-mono);font-size:13px;color:var(--ink2)}
.j-text{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* Chiffrage */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.bars{display:grid;gap:6px}
.hb{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13px;position:relative}
.hb .t{height:16px;position:relative}
.hb .t i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0}
.hb .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.hb:hover .t i{filter:brightness(1.12)}
.tbl-box{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:12px;position:sticky;top:0;background:var(--surface)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cat td{background:var(--sunken);font-weight:600}
.note{color:var(--muted);font-size:12px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}
/* Référentiel ANSSI */
.gap-panel{border-color:color-mix(in srgb,var(--review) 45%,var(--line));background:color-mix(in srgb,var(--review) 7%,var(--surface))}
.a-sec{display:grid;gap:10px}
.a-tbl td{font-size:13px}
.a-tbl td:first-child{min-width:220px;font-weight:500}
.a-tbl td.ref{font-family:var(--f-mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.a-tbl a,.guides a,.a-list a{color:var(--accent)}
.ptchip{font:500 11px var(--f-mono);padding:1px 6px;border-radius:4px;border:1px solid var(--line);background:var(--sunken);color:var(--ink2);cursor:pointer;margin:0 3px 3px 0}
.ptchip:hover{border-color:var(--accent);color:var(--ink)}
.ptchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.a-list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.guides{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
code{font-family:var(--f-mono);font-size:.92em;background:var(--sunken);padding:0 4px;border-radius:3px}
@media (max-width:700px){
  .g-row{grid-template-columns:190px 1fr}
  .gantt{min-width:760px}
  .j-form .row3{grid-template-columns:1fr 1fr}
  .j-form .row3 .field:last-child{grid-column:1/-1}
  .j-item{grid-template-columns:1fr auto}
  .j-item .j-text{grid-column:1/-1;grid-row:2}
  .hb{grid-template-columns:110px 1fr 78px}
}
@media (prefers-reduced-motion:no-preference){.bar i,.meter i,.hb .t i{transition:width .35s ease}}
</style>

<header class="top">
  <div class="wrap">
    <div>
      <div class="eyebrow">BUT3 R&amp;T · R5.08 Gestion de projets · SAÉ 5.02</div>
      <h1>Site de Marseille, suivi du projet</h1>
    </div>
    <div class="stats" id="stats"></div>
    <div class="dates" id="dates"></div>
    <nav class="tabs" aria-label="Vues">
      <a href="#roadmap" data-v="roadmap">Roadmap</a>
      <a href="#journal" data-v="journal">Journal de bord</a>
      <a href="#chiffrage" data-v="chiffrage">Chiffrage infra</a>
      <a href="#anssi" data-v="anssi">Référentiel ANSSI</a>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<div id="drawer-host"></div>
<div class="tip" id="tip" hidden></div>

<script>
const EST = /*ESTIMATION*/null;
const ANSSI = /*ANSSI*/null;
const META = /*META*/null;
const STATUS = {todo:{l:"À faire",c:"var(--todo)"},doing:{l:"En cours",c:"var(--doing)"},review:{l:"À relire",c:"var(--review)"},done:{l:"Terminé",c:"var(--done)"}};
const AXES = {A:"A · Architecture physique",B:"B · Architecture réseaux",C:"C · Architecture système",D:"D · WAN",E:"E · Sécurité",G:"Gestion de projet",I:"Innovation",F:"Chiffrage",L:"Livrables"};
const KINDS = {reunion:"Réunion de suivi",avancement:"Avancement",decision:"Décision",probleme:"Problème / blocage",client:"Réunion client"};
const S = {aPt:"all", aQ:"", points:new Map(), journal:[], meta:{}, loaded:false, slow:false, offline:false, canWrite:true, sel:null, axis:"all", status:"all", q:"", names:{}, me:null, jDel:null};
let db=null, user=null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const todayUTC=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const fmt=s=>{const t=D(s);return t?new Date(t).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",timeZone:"UTC"}):"—"};
const fmtLong=s=>{const t=D(s);return t?new Date(t).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}):"—"};
const eur=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(n)+" €";
const keur=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Math.round(n/1000))+" k€";
function prog(p){if(p.status==="done")return 100;const t=p.tasks||[];if(!t.length)return 0;return Math.round(100*t.filter(x=>x.done).length/t.length)}
function isLate(p){return p.status!=="done"&&D(p.due)&&D(p.due)<todayUTC()}
function sorted(){return [...S.points.entries()].map(([id,p])=>({id,...p})).sort((a,b)=>(a.num||0)-(b.num||0))}
function view(){const h=location.hash.slice(1);return ["roadmap","journal","chiffrage","anssi"].includes(h)?h:"roadmap"}

/* ---------- écritures : une à la fois par document ---------- */
const queues=new Map();
function write(path,data){
  if(!db||!S.canWrite)return Promise.resolve();
  const prev=queues.get(path)||Promise.resolve();
  const p=prev.then(()=>db.doc(path).update(data)).catch(e=>onWriteErr(e));
  queues.set(path,p);return p;
}
function onWriteErr(e){if(e&&e.code==="invalid_argument"){S.canWrite=false;renderAll()}else{console.warn(e)}}

/* ---------- en-tête ---------- */
function renderStats(){
  const pts=sorted();const el=$("#stats");
  if(!pts.length){el.innerHTML="";return}
  const avg=Math.round(pts.reduce((s,p)=>s+prog(p),0)/pts.length);
  const done=pts.filter(p=>p.status==="done").length, doing=pts.filter(p=>p.status==="doing"||p.status==="review").length, late=pts.filter(isLate).length;
  const r=D(S.meta.rendu), days=r?Math.ceil((r-todayUTC())/864e5):null;
  const nt=pts.reduce((s,p)=>s+(p.tasks||[]).length,0), nd=pts.reduce((s,p)=>s+(p.tasks||[]).filter(t=>t.done).length,0);
  el.innerHTML=`
   <div class="stat"><span class="k">Avancement global</span><span class="v">${avg} %</span><div class="meter"><i style="width:${avg}%"></i></div></div>
   <div class="stat"><span class="k">Points du cahier des charges</span><span class="v">${done} / ${pts.length}</span><span class="s">${doing} en cours · ${pts.length-done-doing} à faire</span></div>
   <div class="stat"><span class="k">Tâches cochées</span><span class="v">${nd} / ${nt}</span><span class="s">${late?`<span class="pill late">! ${late} point${late>1?"s":""} en retard</span>`:"aucun point en retard"}</span></div>
   <div class="stat"><span class="k">Rendu des supports</span><span class="v">${days===null?"—":days>=0?"J-"+days:"Rendu passé"}</span><span class="s">${fmtLong(S.meta.rendu)}</span></div>`;
  const ro=!S.canWrite||!db;
  $("#dates").innerHTML=`<span>Soutenance</span><input type="date" id="m-sout" value="${esc(S.meta.soutenance||"")}" ${ro?"disabled":""} aria-label="Date de soutenance">
    <span>Rendu des supports (8 à 10 j avant)</span><input type="date" id="m-rendu" value="${esc(S.meta.rendu||"")}" ${ro?"disabled":""} aria-label="Date de rendu">
    <span class="muted">Dates estimées d'après la session précédente : à ajuster dès qu'elles sont annoncées sur AMETICE.</span>`;
  $("#m-sout").onchange=e=>write("meta/projet",{soutenance:e.target.value});
  $("#m-rendu").onchange=e=>write("meta/projet",{rendu:e.target.value});
}

/* ---------- roadmap ---------- */
function range(){return {a:D("2026-09-21"),b:D("2027-03-22")}}
function pct(t){const {a,b}=range();return Math.max(0,Math.min(100,100*(t-a)/(b-a)))}
function renderRoadmap(){
  const v=$("#view");
  if(!S.loaded){v.innerHTML=stateMsg();return}
  const qf=document.activeElement?.id==="f-q", qpos=qf?document.activeElement.selectionStart:0;
  const pts=sorted().filter(p=>(S.axis==="all"||p.axis===S.axis)&&(S.status==="all"||(S.status==="late"?isLate(p):p.status===S.status))&&(!S.q||(p.title+" "+(p.owner||"")+" "+(p.tasks||[]).map(t=>t.t).join(" ")).toLowerCase().includes(S.q.toLowerCase())));
  const months=[];{const {a,b}=range();let d=new Date(a);d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+1);while(d.getTime()<b){months.push(d.getTime());d.setUTCMonth(d.getUTCMonth()+1)}}
  const marks=[["today",todayUTC(),"Aujourd'hui"],["",D(S.meta.rendu),"Rendu"],["",D(S.meta.soutenance),"Soutenance"]].filter(m=>m[1]);
  const grid=months.map(m=>`<div class="g-grid" style="left:${pct(m)}%"></div>`).join("");
  const markHtml=(lbl)=>marks.map(([c,t,l])=>`<div class="g-mark ${c}" style="left:${pct(t)}%">${lbl?`<b>${l}</b>`:""}</div>`).join("");

   ${!db?"":!S.canWrite?`<div class="banner">Lecture seule : votre niveau de partage ne permet pas de modifier le suivi. Demandez un accès Contributeur au propriétaire.</div>`:""}

       <div class="g-track g-months" style="cursor:default">${months.map(m=>`<span style="left:${pct(m)}%">${new Date(m).toLocaleDateString("fr-FR",{month:"short",year:"2-digit",timeZone:"UTC"})}</span>`).join("")}${grid}${markHtml(true)}</div></div>
     ${pts.length?pts.map(p=>{const s=D(p.start)||D(p.due),e=D(p.due)||s;const L=pct(s),W=Math.max(.8,pct(e)-L),pr=prog(p);const col=isLate(p)?"var(--late)":STATUS[p.status]?.c||"var(--todo)";
       return `<div class="g-row ${S.sel===p.id?"sel":""}" data-id="${p.id}">
        <button class="g-label" data-open="${p.id}"><span class="g-num">${String(p.num).padStart(2,"0")}</span><span class="g-title">${esc(p.title)}</span><span class="axis">${esc(p.axis)}</span></button>

/* ---------- référentiel ANSSI (statique) ---------- */
function md(s){let h=esc(s);h=h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);return h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>").replace(/`([^`]+)`/g,"<code>$1</code>")}
function ptsOf(cell){return (String(cell||"").match(/\d+/g)||[]).map(Number)}
function anssiTables(){return (ANSSI?.sections||[]).filter(s=>s.kind==="table").map(s=>{const h=s.head.map(x=>x.toLowerCase());const iPt=h.findIndex(x=>x==="pt");return {s,iPt,iRef:h.findIndex(x=>x.startsWith("réf"))}})}
function guidesFor(num){const out=[];for(const {s,iPt,iRef} of anssiTables()){if(iPt<0)continue;for(const r of s.rows)if(ptsOf(r[iPt]).includes(num))out.push({doc:r[0],ref:iRef>=0?r[iRef]:""})}return out}
function renderAnssi(){
  const v=$("#view");if(!ANSSI){v.innerHTML=`<div class="empty">Référentiel indisponible.</div>`;return}
  const qf=document.activeElement?.id==="a-q",qpos=qf?document.activeElement.selectionStart:0;
  const pt=S.aPt==="all"?null:+S.aPt, q=S.aQ.toLowerCase();
  const title=n=>{const p=[...S.points.values()].find(x=>x.num===n);return p?p.title:""};
  const ptOpts=Array.from({length:21},(_,i)=>i+1).map(n=>`<option value="${n}" ${pt===n?"selected":""}>${String(n).padStart(2,"0")}${title(n)?" · "+esc(title(n)):""}</option>`).join("");
  const secs=[...ANSSI.sections].sort((a,b)=>(/écarts/i.test(b.title)?1:0)-(/écarts/i.test(a.title)?1:0));
  let shown=0;
  const html=secs.map(s=>{
    const gap=/écarts/i.test(s.title);
    if(s.kind==="table"){
      const h=s.head.map(x=>x.toLowerCase()),iPt=h.indexOf("pt"),iRef=h.findIndex(x=>x.startsWith("réf"));
      const rows=s.rows.filter(r=>(!pt||(iPt>=0&&ptsOf(r[iPt]).includes(pt)))&&(!q||r.join(" ").toLowerCase().includes(q)));
      if(!rows.length)return "";shown+=rows.length;
      return `<section class="panel a-sec"><h3>${md(s.title)} <span class="muted small">${rows.length}</span></h3><div class="tbl-box"><table class="a-tbl"><thead><tr>${s.head.map((c,i)=>`<th>${i===iPt?"Points":md(c)}</th>`).join("")}</tr></thead><tbody>
        ${rows.map(r=>`<tr>${r.map((c,i)=>i===iPt?`<td>${ptsOf(c).map(n=>`<button class="ptchip" data-goto="${n}" aria-pressed="${pt===n}" title="${esc(title(n))}">${String(n).padStart(2,"0")}</button>`).join("")}</td>`:`<td class="${i===iRef?"ref":""}">${md(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`}
    if(s.kind==="list"){
      const items=s.items.filter(t=>!q||t.toLowerCase().includes(q));if(!items.length||(pt&&!gap))return "";
      const tag=s.ordered?"ol":"ul";
      return `<section class="panel a-sec ${gap?"gap-panel":""}"><h3>${md(s.title)}</h3><${tag} class="a-list">${items.map(t=>`<li>${md(t)}</li>`).join("")}</${tag}></section>`}
    return ""}).join("");
  v.innerHTML=`<div><h2>Référentiel ANSSI</h2><p class="muted small" style="margin:4px 0 0">${ANSSI.intro.map(md).join(" ")}</p></div>
   <div class="toolbar"><select id="a-pt" aria-label="Filtrer par point du cahier des charges"><option value="all">Tous les points du cahier des charges</option>${ptOpts}</select>
     <input type="search" id="a-q" placeholder="Rechercher un guide, une référence, un équipement (ex. 802.1X, Stormshield)" value="${esc(S.aQ)}" aria-label="Rechercher dans le référentiel"></div>
   ${pt?`<div class="banner">${shown} guide${shown>1?"s":""} pour le point ${String(pt).padStart(2,"0")} · ${esc(title(pt))}. <a href="#roadmap" data-open-pt="${pt}">Ouvrir la fiche du point</a></div>`:""}
   ${html||`<div class="empty">Aucun guide ne correspond à ce filtre.</div>`}`;
  $("#a-pt").onchange=e=>{S.aPt=e.target.value;renderAnssi()};
  $("#a-q").oninput=e=>{S.aQ=e.target.value;renderAnssi()};
  if(qf){const n=$("#a-q");n.focus();try{n.setSelectionRange(qpos,qpos)}catch(e){}}
  v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{S.aPt=S.aPt===b.dataset.goto?"all":b.dataset.goto;renderAnssi();scrollTo({top:0})});
  v.querySelectorAll("[data-open-pt]").forEach(a=>a.onclick=()=>{const n=+a.dataset.openPt;const e=[...S.points.entries()].find(([,x])=>x.num===n);if(e)setTimeout(()=>openPoint(e[0]),0)});
}

/* ---------- rendu global ---------- */
function renderAll(){
  const v=view();document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  renderStats();hideTip();
  if(v==="roadmap")renderRoadmap();else if(v==="journal")renderJournal();else if(v==="anssi")renderAnssi();else renderChiffrage();
  renderDrawer();
}
addEventListener("hashchange",()=>{if(view()!=="roadmap"){S.sel=null;$("#drawer-host").innerHTML=""}renderAll()});

async function boot(){
  renderAll();
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;renderAll()}},10000);
  if(!window.claude?.use){S.offline=true;clearTimeout(timer);renderAll();return}
  [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db){S.offline=true;clearTimeout(timer);renderAll();return}
  if(user){try{S.me=await user.id();const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}}
  const fail=e=>{clearTimeout(timer);S.slow=true;S.loaded=S.points.size>0;renderAll();console.warn(e)};
  db.collection("points").onSnapshot(snap=>{S.points=new Map(snap.docs.map(d=>[d.id,d.data()]));if(!snap.metadata.fromCache){S.loaded=true;S.slow=false;clearTimeout(timer)}else if(snap.size)S.loaded=true;renderAll()},fail);
  db.doc("meta/projet").onSnapshot(d=>{S.meta=d.exists?d.data():{};renderStats();if(view()==="roadmap"&&S.loaded&&!S.sel)renderRoadmap()},fail);
  db.collection("journal").orderBy("date","desc").limit(300).onSnapshot(snap=>{S.journal=snap.docs.map(d=>({id:d.id,...d.data()}));const ae=document.activeElement;if(view()==="journal"&&!(ae&&ae.closest&&ae.closest("#j-form")&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))renderJournal();renderStats();resolveNames()},fail);
}
boot();
</script>
